<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"  initial-scale=1.0">
    <title>Addition</title>
    <style>
        .container
        {
            height:600px;
            width: 400px;
            background-color: bisque;
            margin:2px solid violet;
            border-radius: 20px;
            margin:auto;
        }
        h2{
            color:chocolate;
            font-style: oblique;
            font-size: 50px;
            text-align: center;
            text-shadow: 2px 2px 4px #888888; /*xaxis yaxis blur colour */
            padding-top:10px;
        }
        label{
            color:cornflowerblue;
            font-size: 20px;
            font-style: normal;
            padding-left: 35px;
        }
        button{
            height:30px;
            width:80px;
            background-color: blueviolet;
            border-radius: 5px;
            color: aliceblue;
            font-size: 20px;
            margin-left:170px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
    <h2>Arithmetic Operation using Js</h2>
    <label>Enter Number1:</label><input type="number" id="num1" value=""><br><br>
    <label>Enter Number2:</label><input type="number" id="num2"  value=""><br><br>
    <label>       Result:</label><input type="number" id="res"  value="" ><br><br>
    <button onclick="add()">Add</button>
    <button onclick="sub()">Sub</button>
    <button onclick="mul()">Mul</button>
    <button onclick="clearbox()">clear</button>
    </div>
    <script>
        var box1=document.getElementById("num1");
        var box2=document.getElementById("num2");
        var result=document.getElementById("res");
        function add()
        {
            var a=Number(box1.value);
            var b=Number(box2.value);
            var total=a+b;
            console.log(a);
            console.log(b);
            console.log(total);
            result.value=total;

        }
        function sub()
        {
            var a=Number(box1.value);
            var b=Number(box2.value);
            var difference=a-b;
            console.log(a);
            console.log(b);
            console.log(difference);
            result.value=difference;
        }
        function mul()
        {
            var a=Number(box1.value);
            var b=Number(box2.value);
            var multiplication=a*b;
            console.log(a);
            console.log(b);
            console.log(multiplication);
            result.value=multiplication;
        }
        function clearbox(){
        document.getElementById("num1").value ="";
        document.getElementById("num2").value ="";
        document.getElementById("res").value ="";
        }   


    </script>
</body>
</html>
